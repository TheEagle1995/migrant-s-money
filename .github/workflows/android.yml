name: Android APK

# APK'ni GitHub quradi — lokal Flutter/Android SDK kerak emas.
# Ishga tushirish: Actions -> Android APK -> Run workflow
# Natija: "Artifacts" bo'limida chiroq-apk.zip

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Backend manzili (bo'sh qoldirsangiz ilova ichida sozlanadi)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Platforma fayllarini generatsiya qilish
        # android/ papkasi repoda saqlanmaydi — Flutter uni o'zi yaratadi,
        # shunda SDK/Gradle versiyalari doim mos keladi.
        #
        # Lekin `flutter create` pubspec.yaml va lib/main.dart ni o'z shabloni
        # bilan qayta yozib yuborishi mumkin. Bu bog'liqliklarni (http,
        # shared_preferences) va ilova kodini yo'qotadi, build esa tushunarsiz
        # xato bilan yiqiladi. Shuning uchun avval nusxa olamiz.
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml.bak
          cp -r lib /tmp/lib.bak
          flutter create --platforms=android --org uz.chiroq --project-name chiroq .
          cp /tmp/pubspec.yaml.bak pubspec.yaml
          rm -rf lib && cp -r /tmp/lib.bak lib
          echo "--- pubspec tiklandi:"
          grep -A4 '^dependencies:' pubspec.yaml

      - name: Bizning Android fayllarni qaytarish
        # Manifest (RECEIVE_SMS, receiver) va Kotlin kanallari
        run: ./tool/apply_android_overrides.sh

      - name: Bog'liqliklar
        run: flutter pub get

      - name: APK qurish
        # --split-per-abi: har bir protsessor arxitekturasi uchun alohida APK.
        # Universal APK ~50 MB, alohidalari ~16 MB — ulashish ancha qulay.
        # Universal ham quriladi, chunki arxitekturani bilmaganda u ishlaydi.
        run: |
          EXTRA=""
          if [ -n "${{ github.event.inputs.api_url }}" ]; then
            EXTRA="--dart-define=API_URL=${{ github.event.inputs.api_url }}"
          fi
          flutter build apk --release --split-per-abi $EXTRA
          flutter build apk --release $EXTRA

      - name: Nomini o'zgartirish
        run: |
          mkdir -p out
          STAMP="$(date +%Y%m%d)-${GITHUB_SHA::7}"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             "out/Chiroq-$STAMP-arm64.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
             "out/Chiroq-$STAMP-arm32.apk"
          cp build/app/outputs/flutter-apk/app-release.apk \
             "out/Chiroq-$STAMP-universal.apk"
          ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: chiroq-apk
          path: mobile/out/*.apk
          retention-days: 30

      # Artifact faqat GitHub interfeysi orqali yuklanadi va havolasi vaqtinchalik.
      # Release esa barqaror to'g'ridan-to'g'ri havola beradi — telefonga
      # yuborish, boshqalarga ulashish va avtomatik yuklab olish uchun qulay.
      - name: Release yaratish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="apk-$(date +%Y%m%d-%H%M)-${GITHUB_SHA::7}"
          gh release create "$TAG" out/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Chiroq APK — $(date +%Y-%m-%d\ %H:%M) UTC" \
            --notes "Test uchun APK. Debug kalit bilan imzolangan — telefonga o'rnatish mumkin, Play Store uchun emas.

          **Qaysi faylni olish:**
          - \`arm64\` — deyarli barcha zamonaviy telefonlar (2017 yildan keyingi)
          - \`arm32\` — eski telefonlar
          - \`universal\` — arxitekturani bilmasangiz, hammasida ishlaydi (kattaroq)

          Commit: \`${GITHUB_SHA::7}\`
          Server manzili ilova ichidagi Sozlamalardan kiritiladi."
          echo "TAG=$TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      # APK yuqorida allaqachon qurilib, release'ga yuklangan — shuning uchun
      # bu tekshiruvlar oxirida turadi. Test yiqilsa build qizil bo'ladi va
      # biz bilib olamiz, lekin APK baribir release'da qoladi.
      #
      # Natija release izohiga ham yoziladi: Actions loglari faqat vaqtinchalik
      # havola orqali olinadi, release esa API orqali o'qiladi.
      - name: Analiz va testlar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          flutter analyze --no-fatal-infos > /tmp/analyze.txt 2>&1
          A=$?
          flutter test > /tmp/test.txt 2>&1
          T=$?
          set -e

          echo "=== analyze (exit $A) ==="; cat /tmp/analyze.txt
          echo "=== test (exit $T) ===";    cat /tmp/test.txt

          if [ -n "$TAG" ]; then
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body \
              --jq .body > /tmp/body.md || echo "" > /tmp/body.md
            {
              cat /tmp/body.md
              echo ""
              echo "---"
              echo ""
              echo "### flutter analyze — exit $A"
              echo '```'
              tail -c 3000 /tmp/analyze.txt
              echo '```'
              echo ""
              echo "### flutter test — exit $T"
              echo '```'
              tail -c 3000 /tmp/test.txt
              echo '```'
            } > /tmp/new-body.md
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --notes-file /tmp/new-body.md || true
          fi

          [ "$A" -eq 0 ] && [ "$T" -eq 0 ]
